name: Verify Figure 6

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Recalculate statistics and compare the rendered figure
        run: bash code/run_all.sh
      - name: Store reproduced outputs
        uses: actions/upload-artifact@v4
        with:
          name: figure6-reproduced
          path: build/
          if-no-files-found: error
          retention-days: 7
